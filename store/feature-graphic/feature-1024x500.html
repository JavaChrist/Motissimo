<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",Inter,Arial,sans-serif;
background:linear-gradient(160deg,#7cc7e0 0%,#1e9bbf 45%,#065a68 100%);display:flex;align-items:center;gap:44px;padding:0 64px;color:#fff}
.board{background:#1b1d29;border-radius:44px;padding:26px;display:grid;grid-template-columns:repeat(2,104px);gap:18px;box-shadow:0 30px 60px rgba(0,0,0,.35);flex:none}
.t{height:104px;border-radius:26px;background:linear-gradient(#fdf6ea,#efe0c8);box-shadow:0 10px 0 #cdbca0;display:flex;align-items:center;justify-content:center;font:900 56px Arial Black,Arial,sans-serif;color:#2c241c}
h1{font-size:96px;font-weight:900;letter-spacing:-3px;text-shadow:0 6px 18px rgba(0,0,0,.25)}
p{font-size:30px;white-space:nowrap;margin-top:8px;color:#e6f6fb}
.chips{display:flex;gap:12px;margin-top:30px}
.c{white-space:nowrap;font-size:20px;font-weight:700;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35)}
.c.o{background:#f97316;border-color:#f97316}
</style></head><body>
<div class="board"><div class="t">M</div><div class="t">O</div><div class="t">T</div><div class="t">S</div></div>
<div><h1>Motissimo</h1><p>Trouve les mots cachés dans les tuiles</p>
<div class="chips"><span class="c o">15 niveaux</span><span class="c">Un défi chaque jour</span><span class="c">Hors connexion</span></div></div>
</body></html>
